  </div>

  <div class="relative w-full max-w-6xl bg-[#0B0E14]/80 backdrop-blur-2xl border border-white/5 rounded-[2.5rem] shadow-[0_32px_64px_-16px_rgba(0,0,0,0.6)] overflow-hidden flex flex-col lg:flex-row min-h-[700px]">
    
    <!-- Left: Brand & Visual Perspective -->
    <div class="relative flex-1 bg-[#0D1117] hidden lg:flex items-center justify-center overflow-hidden border-r border-white/5">
      <div class="absolute inset-0 opacity-20">

        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] border border-white/10 rounded-full"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[200px] h-[200px] border border-white/10 rounded-full"></div>
      </div>
      
      <div class="relative z-10 flex flex-col items-center">
        <!-- Abstract Illustration Mockup -->
        <div class="w-64 h-64 relative mb-12">
            <div class="absolute inset-0 bg-blue-600/20 blur-3xl rounded-full"></div>
            <div class="relative w-full h-full bg-gradient-to-br from-blue-500 to-indigo-600 rounded-3xl rotate-12 flex items-center justify-center shadow-2xl">
                <span class="material-symbols-outlined text-7xl text-white">auto_awesome</span>
            </div>
            <div class="absolute -bottom-6 -right-6 w-32 h-32 bg-[#161B22] border border-white/10 rounded-2xl -rotate-12 flex items-center justify-center shadow-xl">
                <span class="material-symbols-outlined text-4xl text-blue-400">terminal</span>

        <h2 class="text-2xl font-semibold text-white tracking-tight text-center px-12">Secure your infrastructure with Luminary.</h2>

    <div class="flex-1 p-8 sm:p-12 lg:p-20 flex flex-col justify-center relative">
      <div class="max-w-sm w-full mx-auto">
        <!-- Logo -->
        <div class="flex items-center gap-3 mb-12 lg:mb-16">
          <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
            <span class="material-symbols-outlined text-white text-2xl">hub</span>
          </div>

        </div>

        <!-- Form -->
        <form class="space-y-5" onsubmit="return false;">
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest ml-1">Full Name</label>

              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl group-focus-within:text-blue-500 transition-colors">person</span>

          </div>

            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest ml-1">Work Email</label>

          </div>

            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest ml-1">Security Token</label>

          <div class="flex items-center gap-3 py-2">

          <button class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-4 rounded-xl shadow-lg shadow-blue-600/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2 mt-6">
            Create my account
            <span class="material-symbols-outlined text-xl">arrow_forward</span>

        <!-- Footer -->
        <div class="mt-12 text-center">
          <p class="text-sm text-slate-500">
