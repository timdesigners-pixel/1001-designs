<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        @theme {
            --font-inter: 'Inter', sans-serif;
            --color-brand-green: #0d2e28;
            --color-brand-dark: #090909;
            --color-input-bg: #1a1a1a;
        }
        body {
            font-family: var(--font-inter);
            background-color: var(--color-brand-dark);
            color: white;
        }
        .mesh-gradient {
            background: radial-gradient(circle at 70% 30%, #154c41 0%, transparent 50%),
                        radial-gradient(circle at 30% 70%, #0d2e28 0%, transparent 50%),
                        #051512;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-5xl bg-black rounded-3xl overflow-hidden flex flex-col md:flex-row shadow-2xl border border-white/5">
        <!-- Left Panel: Onboarding Steps -->
        <div class="md:w-1/2 mesh-gradient p-8 md:p-12 flex flex-col justify-between relative overflow-hidden">
            <div class="relative z-10">
                <h1 class="text-4xl md:text-5xl font-bold leading-tight mb-4 max-w-xs">Get Started with Us</h1>
                <p class="text-white/60 text-sm md:text-base max-w-xs leading-relaxed">
                    Complete these easy steps to register your account.
                </p>
            </div>

            <!-- Steps Indicator -->
            <div class="grid grid-cols-3 gap-3 relative z-10 mt-12 md:mt-0">
                <div class="bg-white text-black p-4 rounded-xl flex flex-col gap-3 h-32 justify-between">
                    <span class="flex items-center justify-center w-6 h-6 rounded-full border border-black text-xs font-bold">1</span>
                    <p class="text-xs font-bold leading-tight uppercase tracking-wider">Sign up your account</p>
                </div>
                <div class="bg-white/10 backdrop-blur-md p-4 rounded-xl flex flex-col gap-3 h-32 justify-between border border-white/10">
                    <span class="flex items-center justify-center w-6 h-6 rounded-full border border-white/40 text-xs text-white/40 font-bold">2</span>
                    <p class="text-xs font-bold leading-tight uppercase tracking-wider text-white/40">Set up your workspace</p>
                </div>
                <div class="bg-white/10 backdrop-blur-md p-4 rounded-xl flex flex-col gap-3 h-32 justify-between border border-white/10">
                    <span class="flex items-center justify-center w-6 h-6 rounded-full border border-white/40 text-xs text-white/40 font-bold">3</span>
                    <p class="text-xs font-bold leading-tight uppercase tracking-wider text-white/40">Set up your profile</p>
                </div>
            </div>
        </div>

        <!-- Right Panel: Form -->
        <div class="md:w-1/2 p-8 md:p-12 bg-black flex flex-col">
            <div class="mb-8">
                <h2 class="text-2xl font-bold mb-2">Sign Up Account</h2>
                <p class="text-white/40 text-sm">Enter your personal data to create your account.</p>
            </div>

            <!-- Social Buttons -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <button class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-colors text-sm font-medium">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google">
                    Google
                </button>
                <button class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-colors text-sm font-medium">
                    <img src="https://www.svgrepo.com/show/439171/github.svg" class="w-4 h-4 invert" alt="Github">
                    Github
                </button>
            </div>

            <div class="relative flex items-center justify-center mb-8">
                <div class="w-full h-px bg-white/10"></div>
                <span class="absolute bg-black px-4 text-xs text-white/30 uppercase tracking-widest">Or</span>
            </div>

            <!-- Registration Form -->
            <form class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-xs font-medium text-white/60">First Name</label>
                        <input type="text" placeholder="eg. John" class="w-full bg-input-bg border border-white/5 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-white/20 transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-medium text-white/60">Last Name</label>
                        <input type="text" placeholder="eg. Francisco" class="w-full bg-input-bg border border-white/5 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-white/20 transition-all">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-medium text-white/60">Email</label>
                    <input type="email" placeholder="eg. johnfrans@gmail.com" class="w-full bg-input-bg border border-white/5 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-white/20 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-medium text-white/60">Password</label>
                    <div class="relative">
                        <input type="password" placeholder="Enter your password" class="w-full bg-input-bg border border-white/5 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-white/20 transition-all">
                        <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/40 hover:text-white">
                            <span class="material-symbols-outlined text-lg">visibility_off</span>
                        </button>
                    </div>
                    <p class="text-[10px] text-white/30">Must be at least 8 characters.</p>
                </div>

                <button class="w-full bg-white text-black font-bold py-3.5 rounded-xl hover:bg-gray-200 transition-colors mt-4 text-sm">
                    Sign Up
                </button>
            </form>

            <p class="text-center text-sm text-white/40 mt-8">
                Already have an account? <a href="#" class="text-white font-semibold hover:underline">Log in</a>
            </p>
        </div>
    </div>
</body>
</html>
