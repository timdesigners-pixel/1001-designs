<div class="min-h-screen w-full flex font-sans antialiased text-slate-900 bg-white">
  <!-- Left Sidebar: Brand & Context (Hidden on mobile) -->
  <aside class="hidden lg:flex w-[38%] bg-[#1a237e] relative overflow-hidden flex-col justify-between p-12 text-white">
    <!-- Background Pattern Overlay -->
    <div class="absolute inset-0 opacity-10 pointer-events-none">
      <svg class="w-full h-full" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />
      </svg>
    </div>

    <!-- Logo Section -->
    <div class="relative z-10 flex items-center gap-3">
      <div class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-lg flex items-center justify-center">
        <span class="material-symbols-outlined text-white text-2xl">architecture</span>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight uppercase">Appgile</h1>
        <p class="text-[10px] opacity-60 tracking-widest uppercase">Developing Future</p>
      </div>
    </div>

    <!-- Narrative Section -->
    <div class="relative z-10 max-w-sm mb-12">
      <h2 class="text-4xl font-semibold mb-4 leading-tight">Check the Status</h2>
      <p class="text-blue-100/70 leading-relaxed mb-8">
        Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation.
      </p>
      <div class="flex gap-3 items-center">
        <div class="h-1 w-12 bg-white rounded-full"></div>
        <div class="h-1 w-6 bg-white/30 rounded-full"></div>
        <div class="h-1 w-6 bg-white/30 rounded-full"></div>
      </div>
    </div>

    <!-- Social & Footer -->
    <div class="relative z-10 flex flex-col gap-8">
      <div class="flex gap-6">
        <a href="#" class="opacity-70 hover:opacity-100 transition-opacity"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" class="opacity-70 hover:opacity-100 transition-opacity"><i class="fa-brands fa-twitter"></i></a>
        <a href="#" class="opacity-70 hover:opacity-100 transition-opacity"><i class="fa-brands fa-linkedin-in"></i></a>
      </div>
      <div class="flex gap-6 text-[11px] font-medium text-blue-100/50 uppercase tracking-widest">
        <a href="#" class="hover:text-white transition-colors">Privacy Policy</a>
        <a href="#" class="hover:text-white transition-colors">Contact</a>
        <span class="ml-auto">©2024 Appgile</span>
      </div>
    </div>
  </aside>

  <!-- Right Content: Auth Form -->
  <main class="flex-1 flex flex-col items-center justify-center p-6 md:p-12 lg:p-24">
    <div class="w-full max-w-[420px] space-y-12">
      <!-- Header -->
      <div class="text-center space-y-2">
        <h2 class="text-3xl font-bold text-[#1a237e]">Welcome To Appgile</h2>
        <p class="text-slate-400 text-sm">Sign in by entering the information below</p>
      </div>

      <!-- Form -->
      <form class="space-y-6" onsubmit="return false;">
        <div class="space-y-1">
          <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Email Address</label>
          <div class="relative flex items-center group">
            <input 
              type="email" 
              placeholder="mail@user.com" 
              class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-slate-700 placeholder:text-slate-300"
            />
          </div>
        </div>

        <div class="space-y-1">
          <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Password</label>
          <div class="relative flex items-center">
            <input 
              type="password" 
              placeholder="••••••••" 
              class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-slate-700 placeholder:text-slate-300"
            />
            <button type="button" class="absolute right-4 text-slate-300 hover:text-slate-500">
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-[11px] font-bold uppercase tracking-wider">
          <label class="flex items-center gap-2 text-slate-400 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 border-slate-200 rounded text-blue-600 focus:ring-blue-500">
            <span>Remember Me</span>
          </label>
          <a href="#" class="text-blue-500 hover:text-blue-600 transition-colors">Forgotten Password</a>
        </div>

        <button class="w-full bg-[#4f80ff] hover:bg-[#3d6de6] text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2 group transition-all hover:-translate-y-0.5 active:translate-y-0">
          <span class="material-symbols-outlined text-xl transition-transform group-hover:scale-110">lock</span>
          <span class="tracking-wider uppercase text-sm">Sign In</span>
        </button>
      </form>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-4">
        <button class="flex items-center justify-center gap-3 px-6 py-4 bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-md hover:border-slate-200 transition-all text-sm font-medium text-slate-600">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Login
        </button>
        <button class="flex items-center justify-center gap-3 px-6 py-4 bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-md hover:border-slate-200 transition-all text-sm font-medium text-slate-600">
          <svg class="w-5 h-5 text-[#0a66c2]" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
          Login
        </button>
      </div>
    </div>

    <!-- Mobile Floating Shapes (Decorative) -->
    <div class="lg:hidden absolute -z-10 top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
       <div class="absolute top-20 right-10 w-4 h-4 bg-blue-500 rotate-45 opacity-20"></div>
       <div class="absolute bottom-20 left-10 w-6 h-6 bg-blue-700 -rotate-12 opacity-10"></div>
    </div>
  </main>
</div>
