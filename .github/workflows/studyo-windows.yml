name: Stüdyo Windows uygulaması
# Elle çalışır. Windows runner'ında testleri ve masaüstü duman testini (gerçek Electron penceresi, Windows ekran görüntüleriyle) koşar,
# kurulum (NSIS) ve taşınabilir exe'yi derler, PE başlığını ve boyutu doğrular, SHA256SUMS-windows.txt ve BUILD-INFO.txt üretir.
# publish=true verilirse studyo-v<sürüm> release'ine yükler; release yoksa oluşturur. Artifact kullanılmaz. Paketler imzasızdır.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'true ise release oluşturulur/güncellenir (varsayılan false: yalnız derleme ve doğrulama)'
        required: false
        default: 'false'
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Masaüstü duman testi (gerçek Electron penceresi)
        shell: pwsh
        run: |
          npm install --no-save playwright@1.49.1
          $env:PLAYWRIGHT_MODULE = 'playwright'
          node tests/desktop-smoke.cjs win-shots
          if ($LASTEXITCODE) { throw 'Duman testi başarısız' }
      - name: Derle
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Paketlenmiş uygulamayla duman testi (win-unpacked; yol boşluk ve Türkçe harf içerir)
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_MODULE = 'playwright'
          $env:BD_SMOKE_EXE = (Resolve-Path 'dist/win-unpacked/Binbir Dizayn Stüdyo.exe').Path
          node tests/desktop-smoke.cjs win-shots
          if ($LASTEXITCODE) { throw 'Paketlenmiş uygulama duman testi başarısız' }
      - name: Doğrula ve özetle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -eq '.exe' -and $_.Name -notmatch 'uninstall' }
          if ($files.Count -ne 2) { throw "2 exe bekleniyordu, bulunan: $($files.Name -join ', ')" }
          New-Item -ItemType Directory -Force release | Out-Null
          foreach ($f in $files) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "$($f.Name) geçerli bir Windows yürütülebilir dosyası değil (MZ başlığı yok)" }
            if ($f.Length -lt 50MB) { throw "$($f.Name) beklenenden küçük: $($f.Length) bayt" }
            Copy-Item $f.FullName release/
          }
          Get-ChildItem win-shots -Filter *.png | ForEach-Object { Copy-Item $_.FullName "release/windows-$($_.Name)" }
          Push-Location release
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS-windows.txt' | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding utf8 SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt
          Pop-Location
          $os = (Get-CimInstance Win32_OperatingSystem)
          @(
            "Ürün: Binbir Dizayn Stüdyo (PL-010) $ver",
            "Commit: $env:GITHUB_SHA",
            "İş akışı: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Derleme ortamı: GitHub Actions windows-latest · $($os.Caption) $($os.Version)",
            "Node: $(node -v) · Electron: $((Get-Content node_modules/electron/package.json -Raw | ConvertFrom-Json).version) · electron-builder: $((Get-Content node_modules/electron-builder/package.json -Raw | ConvertFrom-Json).version)",
            "Tarih (UTC): $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm'))",
            "Testler: npm test (birim) geçti; tests/desktop-smoke.cjs kaynaktan ve paketlenmiş win-unpacked uygulamasıyla (Windows) geçti — ekran görüntüleri paketlenmiş uygulamadan: windows-*.png",
            "İmza: yok (Authenticode imzasız; SmartScreen uyarı verebilir)",
            "Elle yapılmayanlar: gerçek Windows masaüstünde elle kullanım, DPI %125/%150/%200, ekran okuyucu, gerçek Türkçe klavye"
          ) | Set-Content -Encoding utf8 release/BUILD-INFO.txt
          Get-Content release/BUILD-INFO.txt
          Get-ChildItem release | Format-Table Name, Length
      - name: Yayımla
        if: inputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "studyo-v$env:VER"
          $assets = (Get-ChildItem release -File).FullName
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $global:LASTEXITCODE = 0
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE) { throw 'Yükleme başarısız' }
            gh release edit $tag --notes-file studio-desktop/RELEASE-NOTES.md
            if ($LASTEXITCODE) { throw 'Sürüm notları güncellenemedi' }
          } else {
            $global:LASTEXITCODE = 0
            gh release create $tag @assets --target $env:GITHUB_SHA --title "Binbir Dizayn Stüdyo $env:VER — Windows (önizleme)" --notes-file studio-desktop/RELEASE-NOTES.md
            if ($LASTEXITCODE) { throw 'Release oluşturulamadı' }
          }
