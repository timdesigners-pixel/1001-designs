<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - UXOLIST</title>
  <script src="https://cdn.tailwindcss.com/3.4.15"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body class="bg-[#A8C7F0] min-h-screen flex items-center justify-center p-4 md:p-8">

  <div class="bg-white w-full max-w-6xl rounded-[40px] shadow-2xl overflow-hidden flex flex-col md:flex-row">
    
    <!-- Left Section: Form -->
    <div class="w-full md:w-1/2 p-8 md:p-16 flex flex-col justify-center">
      <div class="max-w-md mx-auto w-full">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Create an account</h1>
        <p class="text-gray-400 text-sm mb-10 leading-relaxed">
          Unlock exclusive features and start building your dream project today.
        </p>

        <form class="space-y-6">
          <div>
            <label class="block text-sm font-semibold text-gray-900 mb-1.5">Name</label>
            <input type="text" placeholder="Your name" 
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all placeholder:text-gray-300 text-gray-700">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-900 mb-1.5">Email</label>
            <input type="email" placeholder="Your email" 
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all placeholder:text-gray-300 text-gray-700">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-900 mb-1.5">Password</label>
            <input type="password" placeholder="Create a password" 
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all placeholder:text-gray-300 text-gray-700">
          </div>

          <button type="submit" 
                  class="w-full py-4 bg-[#0F172A] text-white rounded-xl font-semibold hover:bg-black transition-colors shadow-lg shadow-gray-200">
            Create account
          </button>
        </form>

        <div class="relative my-10 flex items-center">
          <div class="flex-grow border-t border-gray-200"></div>
          <span class="flex-shrink mx-4 text-gray-400 text-sm">Or</span>
          <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <button class="flex items-center justify-center py-3 px-4 rounded-xl border border-gray-200 hover:bg-gray-50 transition-colors">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5 mr-2" alt="Google">
          </button>
          <button class="flex items-center justify-center py-3 px-4 rounded-xl border border-gray-200 hover:bg-gray-50 transition-colors">
             <svg class="w-6 h-6 text-[#1877F2]" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Right Section: Visual Content -->
    <div class="hidden md:block w-1/2 p-4 relative">
      <div class="h-full w-full rounded-[32px] overflow-hidden relative">
        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1964&auto=format&fit=crop" 
             alt="Abstract Art" 
             class="absolute inset-0 h-full w-full object-cover">
        
        <!-- Logo Overlay -->
        <div class="absolute top-10 left-10">
          <span class="text-white font-bold text-2xl tracking-tight">UXOLIST</span>
        </div>

        <!-- Testimonial Glass Card -->
        <div class="absolute bottom-10 left-10 right-24">
          <div class="glass p-8 rounded-3xl">
            <p class="text-white text-2xl font-medium leading-snug mb-8">
              I used this for my last project and it saved me at least 10 hours of busy work. Seriously a game changer!
            </p>
            <div class="flex flex-col">
              <span class="text-white font-semibold">Mohin Uddin</span>
              <span class="text-white/60 text-xs mt-0.5">Lead Graphic Designer</span>
            </div>
          </div>
        </div>

        <!-- Navigation Controls with White Corner -->
        <div class="absolute bottom-0 right-0">
          <div class="bg-white p-4 rounded-tl-[32px] flex space-x-3">
            <button class="w-14 h-12 flex items-center justify-center border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
              <span class="material-symbols-outlined text-gray-900">chevron_left</span>
            </button>
            <button class="w-14 h-12 flex items-center justify-center border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
              <span class="material-symbols-outlined text-gray-900">chevron_right</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
